
name: Deploy Keystone

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to new Keystone VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 156.38.217.107
          username: tvallee
          key: ${{ secrets.KEYSTONE_SSH_KEY_NEW }}
          script: |
            set -e
            cd /var/www/keystone
            git fetch origin main
            git reset --hard origin/main
            sudo -n /usr/bin/systemctl restart keystone.service
            sleep 5
            systemctl is-active --quiet keystone.service
