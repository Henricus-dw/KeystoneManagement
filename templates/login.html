<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ APP_NAME }} · Sign in</title>
  <link rel="icon" href="/static/img/favicon.webp" type="image/webp" />
  <link rel="stylesheet" href="/static/css/keystone.css?v={{ asset_ver('css/keystone.css') }}" />
  <link rel="stylesheet" href="/static/css/login.css?v={{ asset_ver('css/login.css') }}" />
</head>
<body class="login">

  <!-- Background video (720p source, blurred so it reads cleanly at 1080p) -->
  <video class="bg-video" id="bgVideo" autoplay muted loop playsinline preload="auto"
         poster="/static/img/logo.webp">
    <source src="/static/vid/loginbg.mp4" type="video/mp4" />
  </video>
  <div class="bg-veil"></div>

  <!-- Login container (falls away on success) -->
  <main class="login-stage" id="loginStage">
    <section class="login-card" id="loginCard">
      <div class="lc-brand">
        <img src="/static/img/logo.svg" alt="Keystone" />
        <div>
          <div class="kicker">Asimotech</div>
          <h1 class="wordmark">KEY<span>STONE</span></h1>
        </div>
      </div>

      <form id="loginForm" method="post" action="/login" autocomplete="on">
        <label class="field">
          <span>Email</span>
          <input type="email" name="email" id="email" required placeholder="you@professional.za.com"
                 value="" autofocus />
        </label>
        <label class="field">
          <span>Password</span>
          <input type="password" name="password" id="password" required placeholder="••••••••" />
        </label>

        <div class="lc-error {% if error %}show{% endif %}" id="loginError">
          {{ error or "" }}
        </div>

        <button class="btn primary lc-submit" type="submit" id="loginBtn">
          <span class="label">Enter Keystone</span>
          <span class="spinner" aria-hidden="true"></span>
        </button>
      </form>

    </section>
  </main>

  <!-- Holographic entrance (revealed after auth, over the still-playing video) -->
  <div class="holo-stage" id="holoStage" aria-hidden="true">
    <div class="holo-logo">
      <svg class="holo-svg" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
        <g>
          <path class="hp shell" d="M243.307 100.723L155.277 12.6929C140.212 -2.37171 115.788 -2.37171 100.723 12.6929L12.6932 100.723C-2.37144 115.787 -2.37144 140.212 12.6932 155.277L100.723 243.307C115.788 258.371 140.212 258.371 155.277 243.307L243.307 155.277C258.371 140.212 258.371 115.787 243.307 100.723Z"/>
          <path class="hp node" d="M21.0411 42.0822C32.6618 42.0822 42.0822 32.6618 42.0822 21.0411C42.0822 9.42042 32.6618 0 21.0411 0C9.42042 0 0 9.42042 0 21.0411C0 32.6618 9.42042 42.0822 21.0411 42.0822Z"/>
          <path class="hp node" d="M234.959 42.0822C246.58 42.0822 256 32.6618 256 21.0411C256 9.42042 246.58 0 234.959 0C223.338 0 213.918 9.42042 213.918 21.0411C213.918 32.6618 223.338 42.0822 234.959 42.0822Z"/>
          <path class="hp node" d="M21.0411 256C32.6618 256 42.0822 246.58 42.0822 234.959C42.0822 223.338 32.6618 213.918 21.0411 213.918C9.42042 213.918 0 223.338 0 234.959C0 246.58 9.42042 256 21.0411 256Z"/>
          <path class="hp node" d="M234.959 256C246.58 256 256 246.58 256 234.959C256 223.338 246.58 213.918 234.959 213.918C223.338 213.918 213.918 223.338 213.918 234.959C213.918 246.58 223.338 256 234.959 256Z"/>
          <path class="hp core" d="M180.074 113.123L142.878 75.9271C134.661 67.7101 121.339 67.7101 113.122 75.9271L75.9259 113.123C67.7089 121.34 67.7089 134.662 75.9259 142.879L113.122 180.075C121.339 188.292 134.661 188.292 142.878 180.075L180.074 142.879C188.291 134.662 188.291 121.34 180.074 113.123Z"/>
        </g>
      </svg>
      <div class="holo-scan"></div>
    </div>
    <div class="holo-word">KEYSTONE</div>
    <div class="holo-sub mono">SYSTEM ONLINE</div>
  </div>

  <script src="/static/js/login.js?v={{ asset_ver('js/login.js') }}"></script>
</body>
</html>
